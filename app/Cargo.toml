[package]
name = "dsh-native-app"
version = "2026.10.10-r2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
dsh-native-core = { path = "../core", features = ["transport"] }
dsh-native-transport = { path = "../transport" }
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "tokio", "advanced-shaping", "advanced", "image-without-codecs"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-util = "=0.3.34"
raw-window-handle = "=0.6.2"
serde_json = "=1.0.151"
serde = {version="=1.0.229",features=["derive"]}
png = "=0.18.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
rustix = { version = "=1.1.5", features = ["fs"] }
# The local wall-clock for a message's time label: std carries no time zone
# database, so the reference's `.timeStart` needs localtime_r.
libc = "=0.2.190"
# Wayland clipboard reads: Iced's bundled smithay-clipboard backend needs a
# focused-seat event and returns "no events received on any seat" for an
# ordinary paste, so text is read through wl-clipboard-rs on its own connection.
wl-clipboard-rs = "=0.9.4"
zeroize = "=1.9.1"
accesskit = "=0.25.1"
accesskit_unix = "=0.24.0"

[features]
public-layout-fixture = []

[[example]]
name = "layout_smoke"
required-features = ["public-layout-fixture"]

[[example]]
name = "scroll_app_smoke"
required-features = ["public-layout-fixture"]

[[example]]
name = "draft_interruption_smoke"
required-features = ["public-layout-fixture"]

[workspace]
members = ["vendor/winit"]

[patch.crates-io]
# Pinned source patch: native Wayland drops on the existing owned winit queue.
winit = { path = "vendor/winit" }

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
