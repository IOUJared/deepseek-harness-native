[package]
name = "dsh-slint-benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit-wayland", "renderer-software", "renderer-femtovg", "compat-1-18"] }
serde_json = "=1.0.145"
# Already present transitively; PNG-only encoding and descriptor-safe snapshot writes.
png = { version = "=0.18.1", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
