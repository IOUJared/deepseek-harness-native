[package]
name = "dsh-native-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Framework-neutral Linux native Harness Host lifecycle foundation"
publish = false

[features]
default = []
transport = ["dep:dsh-native-transport", "dep:tokio", "dep:tokio-util"]

[dependencies]
dsh-native-transport = { path = "../transport", optional = true }
tokio = { version = "=1.53.2", features = ["macros"], optional = true }
tokio-util = { version = "=0.7.19", features = ["rt"], optional = true }
libc = "=0.2.190"
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "time"] }

[[example]]
name = "transport_smoke"
required-features = ["transport"]

[[example]]
name = "file_upload_smoke"
required-features = ["transport"]

[workspace]

[profile.dev]
debug = 1

[profile.release]
lto = false
codegen-units = 16
