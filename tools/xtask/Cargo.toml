[workspace]

[package]
name = "dsh-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Development predicates for the native harness; replaces the Python tooling"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
